<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אופליין - GamerZone</title>
    <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
        Cantarell, sans-serif;
      color: white;
      background: linear-gradient(135deg, #050510 0%, #0a0a1e 100%);
      direction: rtl;
    }

    .container {
      max-width: 500px;
      text-align: center;
    }

    .icon {
      margin-bottom: 20px;
      font-size: 80px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    h1 {
      margin-bottom: 16px;
      font-size: 32px;
      -webkit-text-fill-color: transparent;
      background: linear-gradient(to left, #00ff9d, white);
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      margin-bottom: 32px;
      font-size: 18px;
      line-height: 1.6;
      color: #a0a0a0;
    }

    .retry-button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      color: black;
      cursor: pointer;
      background: #00ff9d;
      border: none;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .retry-button:hover {
      background: #00e68a;
      box-shadow: 0 8px 20px rgba(0, 255, 157, 0.3);
      transform: translateY(-2px);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }

    .cached-pages {
      padding: 20px;
      margin-top: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .cached-pages h2 {
      margin-bottom: 16px;
      font-size: 18px;
      color: #00ff9d;
    }

    .cached-pages ul {
      text-align: right;
      list-style: none;
    }

    .cached-pages li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cached-pages li:last-child {
      border-bottom: none;
    }

    .cached-pages a {
      color: white;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .cached-pages a:hover {
      color: #00ff9d;
    }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>
        נראה שאתה במצב אופליין. חלק מהתכונות עשויות להיות מוגבלות עד שתתחבר
        מחדש.
      </p>

      <button class="retry-button" onclick="location.reload()" type="button">
        נסה שוב
      </button>

      <div class="status" id="status">בודק חיבור...</div>

      <div class="cached-pages">
        <h2>דפים זמינים במצב אופליין</h2>
        <ul>
          <li><a href="/">🏠 דף הבית</a></li>
          <li><a href="/chat">💬 צ'אט</a></li>
          <li><a href="/explore">🔍 חקור</a></li>
          <li><a href="/profile">👤 פרופיל</a></li>
        </ul>
      </div>
    </div>

    <script>
    "use strict";
    // Check connection status
    function updateStatus() {
      const status = document.getElementById("status");
      if (navigator.onLine) {
        status.textContent = "מחובר! רענן את הדף כדי להמשיך.";
        status.style.color = "#00ff9d";
      } else {
        status.textContent = "עדיין לא מחובר...";
        status.style.color = "#666";
      }
    }

    // Listen for online/offline events
    window.addEventListener("online", updateStatus);
    window.addEventListener("offline", updateStatus);

    // Initial check
    updateStatus();

    // Auto-reload when back online
    window.addEventListener("online", () => {
      setTimeout(() => {
        location.reload();
      }, 1000);
    });
    </script>
  </body>
</html>
