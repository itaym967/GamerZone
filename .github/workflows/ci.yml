name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ultracite check
        run: bunx ultracite check

      - name: Build
        run: bun run build

  visual-mobile-public:
    name: Visual Mobile (Public)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium

      - name: Run public visual suite
        env:
          VISUAL_BASE_URL: https://gamer-zone-sigma.vercel.app
        run: bun run test:visual:mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-public
          path: playwright-report
          if-no-files-found: ignore

  visual-mobile-auth:
    name: Visual Mobile (Auth)
    runs-on: macos-14
    if: ${{ secrets.VISUAL_TEST_EMAIL != '' && secrets.VISUAL_TEST_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium

      - name: Run authenticated visual suite
        env:
          VISUAL_BASE_URL: https://gamer-zone-sigma.vercel.app
          VISUAL_TEST_EMAIL: ${{ secrets.VISUAL_TEST_EMAIL }}
          VISUAL_TEST_PASSWORD: ${{ secrets.VISUAL_TEST_PASSWORD }}
        run: bun run test:visual:mobile:auth

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: playwright-report
          if-no-files-found: ignore
